name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RENY_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/reny-release.jks"

      - name: Build release APK
        env:
          RENY_KEYSTORE_FILE: ${{ runner.temp }}/reny-release.jks
          RENY_KEYSTORE_PASSWORD: ${{ secrets.RENY_KEYSTORE_PASSWORD }}
          RENY_KEY_ALIAS: ${{ secrets.RENY_KEY_ALIAS }}
          RENY_KEY_PASSWORD: ${{ secrets.RENY_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk Reny-release.apk

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Reny latest
          prerelease: false
          make_latest: true
          files: Reny-release.apk
